name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build-time Node only: the client is embedded into the binary, the
      # runtime image contains the single executable and nothing else.
      - name: Build web client
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build

      - uses: taiki-e/install-action@cross
        if: matrix.target == 'aarch64-unknown-linux-musl'

      - name: Build (amd64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (arm64 cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "reader-${{ matrix.target }}.tar.gz" reader
          sha256sum "reader-${{ matrix.target }}.tar.gz" > "reader-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/reader-*.tar.gz
            target/${{ matrix.target }}/release/reader-*.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.target }}/release/reader-*.tar.gz
            target/${{ matrix.target }}/release/reader-*.tar.gz.sha256

  docker:
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  # Keep clippy green on every push, mirroring the workspace convention.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # rust-embed compiles the web/dist folder; the tracked placeholder
      # index.html guarantees the folder exists on a bare checkout.
      - name: Ensure embedded web folder
        run: mkdir -p web/dist && test -f web/dist/index.html
      - run: cargo clippy --locked -- -D warnings
