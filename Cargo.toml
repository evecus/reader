[package]
name = "reader"
version = "0.1.0"
edition = "2021"
description = "Server-side reader: Rust engine, embedded web client, single binary"
license = "AGPL-3.0-or-later"

[[bin]]
name = "reader"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "deflate", "blocking"] }
scraper = "0.23"
html5ever = "0.29"
ego-tree = "0.10"
sxd-document = "0.2"
sxd-xpath = "0.2"
rquickjs = { version = "0.14", features = ["array-buffer"] }
regex = "1"
encoding_rs = "0.8"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
ecb = { version = "0.1", features = ["std"] }
block-padding = "0.3"
digest = "0.10"
hex = "0.4"
url = "2"
percent-encoding = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
mime_guess = "2"
tower-http = { version = "0.6", features = ["cors"] }
once_cell = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
